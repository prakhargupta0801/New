<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Prakhar Gupta</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style copy.css">
    <link rel="shortcut icon" href="./images/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="prtf-main">
        <nav class="prtf-header d-flex align-items-center justify-content-between">
            <h3><span class="bold">Lorem, ipsum.</h3>
            <div id="links">
                <a href="#">Home</a>
                <a href="#worksample">Work Samples</a>
                <a href="Prakhar_Gupta.pdf" target="_blank">Download Resume</a>
                <a target="_blank" href="https://github.com/prakhargupta0801"> See Github</a>
            </div>
        </nav>

        <div class="nav-item-icon" id="menuButton">
            <svg width="32px" height="32px" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <g>
                    <line x1="0" y1="10" x2="32" y2="10" stroke-width="2" />
                    <line x1="0" y1="20" x2="32" y2="20" stroke-width="2" />
                </g>
                <g>
                    <line x1="0" y1="16" x2="32" y2="16" stroke-width="2" />
                    <line x1="0" y1="16" x2="32" y2="16" stroke-width="2" />
                </g>
            </svg>
        </div>

        <div class="menu-popup">

        </div>


















        <!-- GSAP CDN -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

        <script>
            const button = document.querySelector('.nav-item-icon');
            const menu = document.querySelector('.menu');
            const menuButton = document.getElementById('menuButton');

            // Toggle menu open/close
            button.addEventListener('click', () => {
                button.classList.toggle('active');
                menu.classList.toggle('-open');
            });

            // Show button after 50px scroll
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    menuButton.classList.add('show');
                } else {
                    menuButton.classList.remove('show');
                }
            });

            // Magnetic hover effect
            menuButton.addEventListener('mousemove', (event) => {
                const rect = menuButton.getBoundingClientRect();
                const x = event.clientX - (rect.left + rect.width / 2);
                const y = event.clientY - (rect.top + rect.height / 2);

                const offsetX = x * 0.2; // smaller multiplier for subtle effect
                const offsetY = y * 0.2;

                gsap.to(menuButton, {
                    x: offsetX,
                    y: offsetY,
                    duration: 0.3,
                    ease: "power2.out"
                });
            });

            menuButton.addEventListener('mouseleave', () => {
                gsap.to(menuButton, {
                    x: 0,
                    y: 0,
                    duration: 0.5,
                    ease: "power2.out"
                });
            });
        </script>

    </div>

</body>

</html>
