<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mouse Move Button</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    .nav-item-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .nav-item-icon svg {
      stroke: #000;
      transition: stroke 0.3s ease;
    }

    .nav-item-icon:hover {
      background: #000;
    }

    .nav-item-icon:hover svg {
      stroke: #fff;
    }
  </style>
</head>
<body>

<div class="nav-item-icon" id="menuButton">
  <svg width="32px" height="32px" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <g>
      <line x1="0" y1="10" x2="32" y2="10" stroke-width="2" />
      <line x1="0" y1="20" x2="32" y2="20" stroke-width="2" />
    </g>
    <g>
      <line x1="0" y1="16" x2="32" y2="16" stroke-width="2" />
      <line x1="0" y1="16" x2="32" y2="16" stroke-width="2" />
    </g>
  </svg>
</div>

<!-- ✅ GSAP CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const menuButton = document.getElementById('menuButton');

  menuButton.addEventListener('mousemove', (event) => {
    const rect = menuButton.getBoundingClientRect();
    const x = event.clientX - (rect.left + rect.width / 2);
    const y = event.clientY - (rect.top + rect.height / 2);

    // scale down movement so it's subtle
    const offsetX = x * 0.1;
    const offsetY = y * 0.1;

    gsap.to(menuButton, {
      x: offsetX,
      y: offsetY,
      duration: 0.3,
      ease: "power2.out"
    });
  });

  menuButton.addEventListener('mouseleave', () => {
    gsap.to(menuButton, {
      x: 0,
      y: 0,
      duration: 0.5,
      ease: "power2.out"
    });
  });
</script>

</body>
</html>
